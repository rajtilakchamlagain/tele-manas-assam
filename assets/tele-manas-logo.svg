  <!-- Text Label -->
  <text x="56" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#1A365D" letter-spacing="0.5">Tele-MANAS</text>
  <text x="57" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="bold" fill="#0D9488" letter-spacing="0.8">ASSAM CELL | 14416</text>
  <text x="57" y="42" font-family="'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="500" fill="#64748B">24x7 Free Mental Health Tele-Service</text>
