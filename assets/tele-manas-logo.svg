      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>
  <!-- Modern Tele-MANAS Emblem -->
  <g transform="translate(6, 4)">
    <circle cx="21" cy="21" r="20" fill="#F0FDF4" stroke="#0D9488" stroke-width="1.8"/>
    <!-- Head silhouette with brain neurons/petals -->
    <path d="M16,13 C12,17 11,23 14,28 C16,32 20,34 23,35 L23,38 L27,38 L27,33 C31,31 34,26 33,21 C32,15 28,12 23,12 C20,12 18,12 16,13 Z" fill="none" stroke="#1A365D" stroke-width="2"/>
    <!-- Sprouting human growth leaves / compassion symbol -->
